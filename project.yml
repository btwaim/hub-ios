name: Hub
options:
  bundleIdPrefix: app.hubmusic
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: "NO"
    ENABLE_PREVIEWS: "NO"
targets:
  Hub:
    type: application
    platform: iOS
    sources:
      - path: Hub
      - path: Shared
    dependencies:
      - target: HubWidgets
        embed: true
    info:
      path: Hub/Info.plist
      properties:
        CFBundleDisplayName: Hub
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIBackgroundModes: [audio, fetch]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAlarmKitUsageDescription: "Hub stellt deine Wecker passend zum Stundenplan."
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: app.hubmusic.hub
            CFBundleURLSchemes: [hubapp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hubmusic.hub
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme: {}
  HubWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: HubWidgets
      - path: Shared
    info:
      path: HubWidgets/Info.plist
      properties:
        CFBundleDisplayName: Hub
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hubmusic.hub.Widgets
        SKIP_INSTALL: "YES"
